pre_check_code:
  stage: pre-check
  image: golang:1.24.2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      changes:
        - "Makefile"
        - "go.mod"
        - "go.sum"
        - ".pre-commit-config.yaml"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/**/*"
        - "cmd/**/*"
        - "internal/**/*"
    - when: never
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git python3 python3-pip make
    - python3 --version
    - pip3 install --break-system-packages --no-cache-dir pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure

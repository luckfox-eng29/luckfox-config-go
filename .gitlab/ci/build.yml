.build_template:
  stage: build
  image: golang:1.24.2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_TAG'
      changes:
        - "Makefile"
        - "go.mod"
        - "go.sum"
        - ".gitlab-ci.yml"
        - ".gitlab/ci/**/*"
        - "cmd/**/*"
        - "internal/**/*"
    - when: never
  variables:
    GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
    GOPROXY: "https://goproxy.cn,direct"
    GOSUMDB: "off"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .cache/go-build
      - .cache/go-mod
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git make
    - go version
    - mkdir -p "$GOCACHE" "$GOMODCACHE"
    - mkdir -p dist
    - touch dist/.keep
    - go mod download
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week

build_arm_multiarch:
  extends:
    - .build_template
  script:
    - make build-arm
    - make build-arm64
